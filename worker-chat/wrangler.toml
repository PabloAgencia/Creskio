# Backend del Agente IA de creskio.com, servido como Worker en
# *.workers.dev en vez de como Pages Function.
#
# Motivo: los bloqueos de LaLiga tumban el rango de IPs donde vive
# creskio.pages.dev (188.114.96.x), pero NO el de workers.dev
# (104.21.x). Sacando el chat a un Worker, la web puede vivir en
# GitHub Pages (inmune a los bloqueos) y seguir teniendo chat.
#
# El codigo es el MISMO fichero que usaba Pages (../functions/api/chat.js),
# importado desde src/index.js: hay una sola copia del system prompt,
# no dos que se desincronicen.

name = "creskio-chat"
main = "src/index.js"
compatibility_date = "2025-01-01"
account_id = "8805ab4e3e430ec0e4a0ca8142402f00"

# Mismo namespace que usaba Pages: el limite de mensajes por IP/sesion
# sigue contando igual, no se reinicia por cambiar de sitio.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "5754438eacfb4acb94cdd4eac3fd756b"
