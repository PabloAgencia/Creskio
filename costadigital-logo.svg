<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="50%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5a623" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.85)"/>
    </linearGradient>
  </defs>

  <!-- Mark: wave with circuit nodes -->
  <!-- Background pill for mark -->
  <rect x="2" y="8" width="64" height="64" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Wave path - second (shadow layer) -->
  <path d="M12 44 C18 36, 24 36, 30 44 C36 52, 42 52, 48 44 C54 36, 60 36, 66 44"
        stroke="url(#waveGrad2)" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Wave path - main -->
  <path d="M12 40 C18 30, 24 30, 30 40 C36 50, 42 50, 48 40 C54 30, 60 30, 66 40"
        stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Circuit nodes at wave peaks/troughs -->
  <!-- Node 1 - start (amber) -->
  <circle cx="12" cy="40" r="3.5" fill="#f5a623"/>
  <circle cx="12" cy="40" r="6" fill="#f5a623" fill-opacity="0.2"/>

  <!-- Node 2 - first peak (amber-orange) -->
  <circle cx="30" cy="40" r="3" fill="#ff6b35"/>
  <circle cx="30" cy="40" r="5.5" fill="#ff6b35" fill-opacity="0.15"/>
  <!-- small cross/circuit detail -->
  <line x1="30" y1="35" x2="30" y2="33" stroke="#ff6b35" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="27" y1="33" x2="33" y2="33" stroke="#ff6b35" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Node 3 - second trough (mid) -->
  <circle cx="48" cy="40" r="3" fill="#60b8ff"/>
  <circle cx="48" cy="40" r="5.5" fill="#60b8ff" fill-opacity="0.15"/>
  <line x1="48" y1="45" x2="48" y2="47" stroke="#60b8ff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="45" y1="47" x2="51" y2="47" stroke="#60b8ff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Node 4 - end (cyan) -->
  <circle cx="66" cy="40" r="3.5" fill="#00d4ff"/>
  <circle cx="66" cy="40" r="6" fill="#00d4ff" fill-opacity="0.2"/>

  <!-- Small pixel dots scattered (digital feel) -->
  <rect x="19" y="25" width="2.5" height="2.5" rx="0.5" fill="#f5a623" opacity="0.4"/>
  <rect x="37" y="57" width="2" height="2" rx="0.5" fill="#ff6b35" opacity="0.35"/>
  <rect x="56" y="23" width="2" height="2" rx="0.5" fill="#00d4ff" opacity="0.4"/>
  <rect x="22" y="56" width="1.5" height="1.5" rx="0.3" fill="#f5a623" opacity="0.25"/>
  <rect x="58" y="55" width="1.5" height="1.5" rx="0.3" fill="#00d4ff" opacity="0.3"/>

  <!-- Wordmark -->
  <!-- "Costa" -->
  <text x="82" y="36" font-family="'Syne', 'Arial Black', sans-serif" font-weight="800" font-size="22" fill="white" letter-spacing="-0.5">Costa</text>
  <!-- "Digital" in gradient -->
  <text x="82" y="62" font-family="'Syne', 'Arial Black', sans-serif" font-weight="800" font-size="22" fill="url(#waveGrad)" letter-spacing="-0.5">Digital</text>

  <!-- Tagline -->
  <text x="83" y="74" font-family="'DM Sans', Arial, sans-serif" font-weight="400" font-size="8.5" fill="rgba(255,255,255,0.45)" letter-spacing="2.5">DISEÑO WEB · SEO LOCAL</text>
</svg>
